<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Registration Form Logo</title>
  <desc id="desc">A modern glassmorphism inspired logo for a registration form web app.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="80" fill="rgba(255,255,255,0.12)"/>
  <circle cx="392" cy="388" r="110" fill="rgba(255,255,255,0.08)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="104" width="320" height="304" rx="48" fill="rgba(15,23,42,0.22)" stroke="rgba(255,255,255,0.30)"/>

    <circle cx="196" cy="180" r="26" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.7)" stroke-width="8"/>
    <path d="M151 266c18-28 48-42 82-42 34 0 64 14 82 42" fill="none" stroke="rgba(255,255,255,0.82)" stroke-width="12" stroke-linecap="round"/>

    <rect x="160" y="286" width="192" height="18" rx="9" fill="rgba(255,255,255,0.72)"/>
    <rect x="160" y="320" width="150" height="18" rx="9" fill="rgba(255,255,255,0.52)"/>
    <rect x="160" y="354" width="176" height="18" rx="9" fill="rgba(255,255,255,0.38)"/>
  </g>

  <path d="M326 170l48 48-48 48" fill="none" stroke="#ecfeff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M268 218h82" fill="none" stroke="#ecfeff" stroke-width="16" stroke-linecap="round"/>
</svg>
